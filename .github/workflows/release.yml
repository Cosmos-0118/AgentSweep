name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - name: set crate version from tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -i.bak "/^version = /s/^version = \".*\"/version = \"$version\"/" Cargo.toml
          rm -f Cargo.toml.bak
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/agentsweep"
          out="dist/agentsweep-${{ matrix.target }}"
          cp "$bin" "$out"
          shasum -a 256 "$out" > "$out.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentsweep-${{ matrix.target }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*

  update-formula:
    needs: [build, release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: update homebrew formula
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/update_homebrew_sha.py "$version" \
            "aarch64-apple-darwin=$(cut -d ' ' -f1 dist/agentsweep-aarch64-apple-darwin.sha256)" \
            "x86_64-apple-darwin=$(cut -d ' ' -f1 dist/agentsweep-x86_64-apple-darwin.sha256)" \
            "x86_64-unknown-linux-gnu=$(cut -d ' ' -f1 dist/agentsweep-x86_64-unknown-linux-gnu.sha256)"
      - name: commit and push
        run: |
          set -euo pipefail
          if git diff --quiet -- homebrew/agentsweep.rb; then
            echo "homebrew formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add homebrew/agentsweep.rb
          git commit -m "chore: update homebrew formula for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
      - name: check tap token
        id: tap
        run: echo "present=${{ secrets.HOMEBREW_TAP_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: checkout tap
        if: steps.tap.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Cosmos-0118/homebrew-agentsweep
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: sync formula to tap
        if: steps.tap.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp homebrew/agentsweep.rb tap/Formula/agentsweep.rb
          cd tap
          git add Formula/agentsweep.rb
          if git diff --cached --quiet; then
            echo "tap formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "agentsweep ${GITHUB_REF_NAME}"
          git push origin HEAD:main
