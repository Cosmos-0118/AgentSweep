[[rule]]
id = "codex.logs.sqlite"
tool = "codex"
root = "home"
label = "Diagnostic logs"
paths = ["logs_2.sqlite", "logs_2.sqlite-wal", "logs_2.sqlite-shm"]
risk = "safe"
requires_stopped = true
older_than_days = 0
consequence = "Deletes local diagnostic logs only. Codex recreates them on next run."

[[rule]]
id = "codex.logs.text"
tool = "codex"
root = "home"
label = "Text logs"
paths = ["log"]
risk = "safe"
older_than_days = 0
consequence = "Deletes Codex text/TUI logs. They are recreated automatically."

[[rule]]
id = "codex.cache"
tool = "codex"
root = "home"
label = "Model and tool caches"
paths = ["cache", "models_cache.json"]
risk = "safe"
older_than_days = 0
consequence = "Deletes regenerable model/plugin catalog caches. Not plugin payloads."

[[rule]]
id = "codex.tmp"
tool = "codex"
root = "home"
label = "Temporary files"
paths = ["tmp", ".tmp"]
risk = "safe"
requires_stopped = true
older_than_days = 0
consequence = "Deletes Codex runtime temp files. Safe only while Codex is stopped."

[[rule]]
id = "codex.shell_snapshots"
tool = "codex"
root = "home"
label = "Stale shell snapshots"
paths = ["shell_snapshots"]
risk = "safe"
older_than_days = 3
consequence = "Deletes shell environment snapshots older than 3 days. Codex already treats these as stale. They can contain exported secrets."

[[rule]]
id = "codex.attachments"
tool = "codex"
root = "home"
label = "Session artifacts"
paths = ["attachments", "generated_images", "computer-use", "visualizations"]
risk = "review"
older_than_days = 0
consequence = "Deletes generated images and session artifacts. Conversations stay. Some tool outputs cannot be regenerated."

[[rule]]
id = "codex.history"
tool = "codex"
root = "home"
label = "Prompt history"
paths = ["history.jsonl"]
risk = "userdata"
older_than_days = 0
consequence = "Deletes typed prompt history. Up/down recall is gone. Conversation transcripts are stored elsewhere and are NOT deleted."

[[rule]]
id = "codex.sessions"
tool = "codex"
root = "home"
label = "Conversation sessions"
paths = ["sessions"]
risk = "userdata"
older_than_days = 0
consequence = "Deletes full conversation rollouts. You will not be able to resume those threads."

[[rule]]
id = "codex.archived_sessions"
tool = "codex"
root = "home"
label = "Archived sessions"
paths = ["archived_sessions", "session_index.jsonl"]
risk = "userdata"
older_than_days = 0
consequence = "Deletes archived conversation rollouts and thread name metadata."

[[rule]]
id = "codex.auth"
tool = "codex"
root = "home"
label = "Credentials"
paths = ["auth.json", ".credentials.json"]
risk = "critical"
consequence = "Login and API credentials. AgentSweep will never delete these."

[[rule]]
id = "codex.config"
tool = "codex"
root = "home"
label = "Configuration"
paths = ["config.toml", "AGENTS.md", "hooks.json", "keybindings.json", "skills", "rules"]
risk = "critical"
consequence = "Codex settings, skills, hooks and keybindings. Never deleted."

[[rule]]
id = "codex.state"
tool = "codex"
root = "home"
label = "Live session state"
paths = ["state_5.sqlite", "state_5.sqlite-wal", "state_5.sqlite-shm"]
risk = "critical"
consequence = "Thread/session indexes. Deleting this corrupts resume. Never deleted."

[[rule]]
