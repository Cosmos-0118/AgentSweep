tool = "codex"
root = "home"
label = "Memories"
paths = ["memories", "memories_1.sqlite", "memories_1.sqlite-wal", "memories_1.sqlite-shm"]
risk = "critical"
consequence = "Persistent Codex memories. Never deleted."

[[rule]]
