[[rule]]
id = "codex.logs.sqlite"
tool = "codex"
root = "home"
label = "Diagnostic logs"
paths = ["logs_2.sqlite", "logs_2.sqlite-wal", "logs_2.sqlite-shm"]
risk = "safe"
requires_stopped = true
older_than_days = 0
consequence = "Deletes local diagnostic logs only. Codex recreates them on next run."

[[rule]]
id = "codex.logs.text"
tool = "codex"
root = "home"
label = "Text logs"
paths = ["log"]
risk = "safe"
older_than_days = 0
consequence = "Deletes Codex text/TUI logs. They are recreated automatically."

[[rule]]
id = "codex.cache"
tool = "codex"
root = "home"
label = "Model and tool caches"
paths = ["cache", "models_cache.json"]
risk = "safe"
older_than_days = 0
consequence = "Deletes regenerable model/plugin catalog caches. Not plugin payloads."

[[rule]]
id = "codex.tmp"
tool = "codex"
root = "home"
label = "Temporary files"
paths = ["tmp", ".tmp"]
risk = "safe"
requires_stopped = true
older_than_days = 0
consequence = "Deletes Codex runtime temp files. Safe only while Codex is stopped."

[[rule]]
id = "codex.shell_snapshots"
tool = "codex"
root = "home"
label = "Stale shell snapshots"
paths = ["shell_snapshots"]
risk = "safe"
older_than_days = 3
consequence = "Deletes shell environment snapshots older than 3 days. Codex already treats these as stale. They can contain exported secrets."

[[rule]]
id = "codex.attachments"
tool = "codex"
root = "home"
label = "Session artifacts"
paths = ["attachments", "generated_images", "computer-use", "visualizations"]
risk = "review"
older_than_days = 0
consequence = "Deletes generated images and session artifacts. Conversations stay. Some tool outputs cannot be regenerated."

[[rule]]
id = "codex.history"
tool = "codex"
root = "home"
label = "Prompt history"
paths = ["history.jsonl"]
risk = "userdata"
older_than_days = 0
consequence = "Deletes typed prompt history. Up/down recall is gone. Conversation transcripts are stored elsewhere and are NOT deleted."

[[rule]]
id = "codex.sessions"
tool = "codex"
root = "home"
label = "Conversation sessions"
paths = ["sessions"]
risk = "userdata"
older_than_days = 0
consequence = "Deletes full conversation rollouts. You will not be able to resume those threads."

[[rule]]
id = "codex.archived_sessions"
tool = "codex"
root = "home"
label = "Archived sessions"
paths = ["archived_sessions", "session_index.jsonl"]
risk = "userdata"
older_than_days = 0
consequence = "Deletes archived conversation rollouts and thread name metadata."

[[rule]]
id = "codex.auth"
tool = "codex"
root = "home"
label = "Credentials"
paths = ["auth.json", ".credentials.json"]
risk = "critical"
consequence = "Login and API credentials. AgentSweep will never delete these."

[[rule]]
id = "codex.config"
tool = "codex"
root = "home"
label = "Configuration"
paths = ["config.toml", "AGENTS.md", "hooks.json", "hooks.json.bak", "keybindings.json", "skills", "rules", "agents", "automations"]
risk = "critical"
consequence = "Codex settings, skills, hooks and keybindings. Never deleted."

[[rule]]
id = "codex.state"
tool = "codex"
root = "home"
label = "Live session state"
paths = ["state_5.sqlite", "state_5.sqlite-wal", "state_5.sqlite-shm", "thread_history_1.sqlite", "thread_history_1.sqlite-wal", "thread_history_1.sqlite-shm", "thread-writer-locks"]
risk = "critical"
consequence = "Thread/session history and writer coordination. SQLite WAL/SHM files are part of the database state. Never deleted."

[[rule]]
id = "codex.memories"
tool = "codex"
root = "home"
label = "Memories"
paths = ["memories", "memories_1.sqlite", "memories_1.sqlite-wal", "memories_1.sqlite-shm"]
risk = "critical"
consequence = "Persistent Codex memories. Never deleted."

[[rule]]
id = "codex.goals"
tool = "codex"
root = "home"
label = "Goals and queue"
paths = ["goals_1.sqlite", "goals_1.sqlite-wal", "goals_1.sqlite-shm", "queue_1.sqlite", "queue_1.sqlite-wal", "queue_1.sqlite-shm"]
risk = "critical"
consequence = "Goal and background queue state. Never deleted."

[[rule]]
id = "codex.plugins"
tool = "codex"
root = "home"
label = "Installed plugins"
paths = ["plugins"]
risk = "critical"
consequence = "Installed plugin payloads live here, including plugins/cache. Deleting them leaves plugins marked installed but empty. Never deleted."

[[rule]]
id = "codex.desktop_state"
tool = "codex"
root = "home"
label = "Codex identity and desktop state"
paths = ["pets", ".codex-global-state.json", ".codex-global-state.json.bak", "installation_id", "external_agent_session_imports.json", "chrome-native-hosts-v2.json", ".sandbox_migration", ".personality_migration"]
risk = "critical"
consequence = "Custom pets, installation identity, imported-session ledger, browser registration and persistent desktop/migration state. Never deleted."

[[rule]]
id = "codex.sqlite"
tool = "codex"
root = "home"
label = "Codex SQLite state"
paths = ["sqlite"]
risk = "critical"
consequence = "Active Codex databases. This is application state, not SQLite cache. Never deleted."

[[rule]]
id = "codex.process_manager"
tool = "codex"
root = "home"
label = "Reset stale process state"
paths = ["process_manager"]
risk = "review"
requires_stopped = true
consequence = "Rebuildable process bookkeeping. Reset only when Codex is fully closed; active process tracking is lost."

[[rule]]
id = "codex.vendor_imports"
tool = "codex"
root = "home"
label = "Managed vendor skill checkout"
paths = ["vendor_imports/skills"]
risk = "review"
requires_stopped = true
consequence = "Known managed recommended-skill checkout. Codex can re-download it when needed; other vendor-import data is not selected."

[[rule]]
id = "codex.version_cache"
tool = "codex"
root = "home"
label = "Version check cache"
paths = ["version.json"]
risk = "safe"
requires_stopped = true
consequence = "Cached latest-version check. Codex refreshes it automatically."

[[rule]]
id = "claude.plans"
tool = "claude"
root = "home"
label = "Old plan files"
paths = ["plans"]
risk = "safe"
consequence = "Deletes old plan-mode files. Claude already auto-cleans these after cleanupPeriodDays."

[[rule]]
id = "claude.debug"
tool = "claude"
root = "home"
label = "Debug logs"
paths = ["debug", "daemon.log"]
risk = "safe"
consequence = "Deletes Claude debug logs."

[[rule]]
id = "claude.paste_cache"
tool = "claude"
root = "home"
label = "Paste cache"
paths = ["paste-cache"]
risk = "safe"
consequence = "Deletes large pasted inputs. They can be re-pasted."

[[rule]]
id = "claude.image_cache"
tool = "claude"
root = "home"
label = "Image cache"
paths = ["image-cache"]
risk = "safe"
consequence = "Deletes cached attached images."

[[rule]]
id = "claude.session_env"
tool = "claude"
root = "home"
label = "Session environment"
paths = ["session-env", "tasks", "shell-snapshots", "backups", "todos"]
risk = "safe"
consequence = "Deletes session metadata, tasks, shell snapshots, migration backups and legacy todos."

[[rule]]
id = "claude.stats"
tool = "claude"
root = "home"
label = "Usage statistics"
paths = ["stats-cache.json"]
risk = "review"
consequence = "Deletes historical /usage totals. Claude keeps working."

[[rule]]
id = "claude.file_history"
tool = "claude"
root = "home"
label = "File checkpoints"
paths = ["file-history"]
risk = "userdata"
consequence = "Deletes pre-edit snapshots used by /rewind. Past sessions cannot restore files."

[[rule]]
id = "claude.history"
tool = "claude"
root = "home"
label = "Prompt history"
paths = ["history.jsonl"]
risk = "userdata"
consequence = "Deletes typed prompt history. Up/down recall is gone. Project transcripts stay."

[[rule]]
id = "claude.projects"
tool = "claude"
root = "home"
label = "Project transcripts"
paths = ["projects"]
risk = "userdata"
delegate = "claude.project_purge"
consequence = "Deletes project chat transcripts via Claude's own purge command. You cannot resume those chats."

[[rule]]
id = "claude.memory"
tool = "claude"
root = "home"
label = "Auto-memory"
paths = ["memory"]
risk = "critical"
consequence = "Claude's persistent cross-conversation auto-memory. Never deleted."

[[rule]]
id = "claude.jobs"
tool = "claude"
root = "home"
label = "Background-agent job state"
paths = ["jobs"]
risk = "critical"
consequence = "Background-agent job state used by Agent View. Deleting can break Claude's knowledge of running or resumable jobs. Never deleted."

[[rule]]
id = "claude.daemon"
tool = "claude"
root = "home"
label = "Background-agent daemon state"
paths = ["daemon"]
risk = "critical"
consequence = "The background-agent supervisor roster and bridge key. Deleting can sever reconnection to live background agents. Never deleted."

[[rule]]
id = "claude.telemetry"
tool = "claude"
root = "home"
label = "Telemetry buffer"
paths = ["telemetry"]
risk = "safe"
requires_stopped = true
consequence = "Deletes buffered operational telemetry events. Not conversation data; regenerated as Claude runs."

[[rule]]
id = "claude.cache"
tool = "claude"
root = "home"
label = "Generated cache"
paths = ["cache"]
risk = "safe"
requires_stopped = true
consequence = "Deletes Claude-generated cache files. Regenerated automatically."

[[rule]]
id = "claude.dotfile"
tool = "claude"
root = "dotfile"
label = "App state and OAuth"
paths = ["."]
risk = "critical"
consequence = "~/.claude.json holds OAuth, MCP config and per-project state. Never deleted."

[[rule]]
id = "claude.config"
tool = "claude"
root = "home"
label = "Configuration"
paths = ["settings.json", "CLAUDE.md", "agents", "skills", "rules", "plugins", "hooks"]
risk = "critical"
consequence = "Claude settings, skills, agents, rules, hooks and plugins. Never deleted."

[[rule]]
id = "claude.unknown.extra"
tool = "claude"
root = "home"
label = "Unclassified Claude data"
paths = ["downloads", "sessions"]
risk = "unknown"
consequence = "Not in the published Claude storage map. Shown for size only. Never deleted."

[[rule]]
id = "opencode.cache"
tool = "opencode"
root = "cache"
label = "Package and skill cache"
paths = ["."]
risk = "safe"
consequence = "Deletes ~/.cache/opencode. OpenCode rebuilds it. Official troubleshooting step."

[[rule]]
id = "opencode.logs"
tool = "opencode"
root = "log"
label = "Logs"
paths = ["."]
risk = "safe"
consequence = "Deletes OpenCode logs and profiles."

[[rule]]
id = "opencode.tmp"
tool = "opencode"
root = "tmp"
label = "Temp files"
paths = ["."]
risk = "safe"
requires_stopped = true
consequence = "Deletes OpenCode temp files. Safe only while OpenCode is stopped."

[[rule]]
id = "opencode.state_service"
tool = "opencode"
root = "state"
label = "Service registration"
paths = ["service.json"]
risk = "safe"
requires_stopped = true
consequence = "Deletes the stopped-service registration file."

[[rule]]
id = "opencode.repos"
tool = "opencode"
root = "repos"
label = "Cloned reference repos"
paths = ["."]
risk = "review"
consequence = "Deletes cloned reference repositories. They can be re-fetched. Offline work will need a re-clone."

[[rule]]
id = "opencode.tool_output"
tool = "opencode"
root = "data"
label = "Tool output"
paths = ["tool-output"]
risk = "review"
consequence = "Deletes tool/session-associated outputs. Conversations stay."

[[rule]]
id = "opencode.snapshots"
tool = "opencode"
root = "data"
label = "Filesystem snapshots"
paths = ["snapshot"]
risk = "review"
delegate = "opencode.snapshot_prune"
consequence = "Deletes /undo /redo filesystem rollback history. Conversations stay. Old file restoration becomes unavailable."

[[rule]]
id = "opencode.sessions"
tool = "opencode"
root = "data"
label = "Sessions inactive >=30d"
paths = []
risk = "userdata"
delegate = "opencode.session_delete"
consequence = "Permanently deletes only sessions inactive for 30+ days through OpenCode's own command, then vacuums the database. This cannot be restored from quarantine. Auth and config stay."

[[rule]]
id = "opencode.auth"
tool = "opencode"
root = "data"
label = "Credentials"
paths = ["auth.json", "account.json"]
risk = "critical"
consequence = "Provider credentials. Never deleted."

[[rule]]
id = "opencode.db"
tool = "opencode"
root = "data"
label = "Session database"
paths = ["opencode.db", "opencode.db-wal", "opencode.db-shm"]
risk = "critical"
consequence = "The live session database. AgentSweep never deletes this file. Use session cleanup instead."

[[rule]]
id = "opencode.config"
tool = "opencode"
root = "config"
label = "Configuration"
paths = ["."]
risk = "critical"
consequence = "Models, plugins, MCP and user config. Never deleted."

[[rule]]
id = "opencode.legacy_storage"
tool = "opencode"
root = "data"
label = "Legacy JSON storage"
paths = ["storage"]
risk = "unknown"
delegate = "opencode.legacy_guard"
consequence = "Old JSON session system. Refused if any sessions are not in the SQLite database."

[[rule]]
id = "codex.desktop.cache"
tool = "codex"
root = "desktop"
label = "Desktop app caches"
paths = ["Crashpad", "component_crx_cache", "extensions_crx_cache", "BrowserMetrics-spare.pma", "GrShaderCache", "GraphiteDawnCache"]
risk = "safe"
requires_stopped = true
consequence = "Crash reports and Chromium download/render caches. Regenerated automatically when Codex is closed."

[[rule]]
id = "codex.desktop.profile"
tool = "codex"
root = "desktop"
label = "Reset desktop browser profile"
paths = ["Default"]
risk = "review"
requires_stopped = true
consequence = "Resets the embedded Chromium profile, including the Codex browser partition, local storage, cookies and session state. Not routine cleanup."

[[rule]]
id = "codex.desktop.local_state"
tool = "codex"
root = "desktop"
label = "Desktop browser engine state"
paths = ["Local State"]
risk = "critical"
consequence = "Chromium installation-wide preferences and runtime metadata. Reset only as targeted troubleshooting; never auto-deleted."

[[rule]]
id = "codex.desktop_feature_state"
tool = "codex"
root = "desktop"
label = "Reset Codex feature state"
paths = ["owl-feature-bootstrap-cache.json", "statsig-state.json", "statsig-state.json.bak", "browser-sidebar-page-states.json", "first_party_sets.db", "first_party_sets.db-journal", "segmentation_platform"]
risk = "review"
requires_stopped = true
consequence = "Feature-gate, sidebar and browser-derived state. Recreated after a reset, but may change feature availability or browser restoration."

[[rule]]
id = "codex.desktop_components"
tool = "codex"
root = "desktop"
label = "Rebuildable Chromium components"
paths = ["WidevineCdm", "OptimizationHints", "Subresource Filter", "PKIMetadata", "Crowd Deny", "ActorSafetyLists", "CaptchaProviders", "TrustTokenKeyCommitments", "MEIPreload", "FileTypePolicies", "AmountExtractionHeuristicRegexes", "WasmTtsEngine", "OnDeviceHeadSuggestModel", "ZxcvbnData", "CertificateRevocation", "SafetyTips", "FirstPartySetsPreloaded", "SSLErrorAssistant", "ChromeFeatureState"]
risk = "review"
requires_stopped = true
consequence = "Downloaded browser components. They can be re-downloaded, but security and browser features may be stale until then; leave them by default."

[[rule]]
id = "codex.desktop.browser_partition"
tool = "codex"
root = "desktop"
label = "Reset Codex browser partition"
paths = ["codex-browser-app"]
risk = "review"
requires_stopped = true
consequence = "Resets Codex's embedded browser cookies, local storage and session state. Use only to troubleshoot browser state."

[[rule]]
id = "codex.desktop.last_version"
tool = "codex"
root = "desktop"
label = "Desktop version metadata"
paths = ["Last Version"]
risk = "critical"
consequence = "Tiny Chromium compatibility metadata. Leave it managed by Codex; never auto-deleted."

[[rule]]
id = "codex.desktop.sentry"
tool = "codex"
root = "desktop"
label = "Diagnostic report state"
paths = ["sentry"]
risk = "unknown"
consequence = "May contain queued crash or diagnostic reports. Inspect its contents before any manual cleanup."

[[rule]]
id = "claude.desktop.cache"
tool = "claude"
root = "desktop"
label = "Desktop app caches"
paths = ["Cache", "Code Cache", "GPUCache", "DawnWebGPUCache", "DawnGraphiteCache", "Shared Dictionary", "Trust Tokens", "DIPS", "DIPS-wal", "DIPS-shm"]
risk = "safe"
requires_stopped = true
consequence = "Standard Chromium render/compile caches used by the Claude desktop app. Regenerated automatically."

[[rule]]
id = "claude.desktop.crashpad"
tool = "claude"
root = "desktop"
label = "Crash-report state"
paths = ["Crashpad"]
risk = "review"
requires_stopped = true
consequence = "Chromium/Electron crash-handler state. Can contain crash dumps not yet uploaded/processed. Quarantined, not hard-deleted, so it can be recovered."

[[rule]]
id = "claude.desktop.webdata"
tool = "claude"
root = "desktop"
label = "Desktop webview storage"
paths = ["IndexedDB", "Local Storage", "Session Storage", "Partitions", "WebStorage", "Cookies", "Cookies-journal"]
risk = "review"
requires_stopped = true
consequence = "Webview storage for the desktop app UI, including cookies. May include sign-in/session state; you may need to re-authenticate."

[[rule]]
id = "claude.desktop.vm_bundles"
tool = "claude"
root = "desktop"
label = "Cowork sandbox VM image"
paths = ["vm_bundles"]
risk = "userdata"
requires_stopped = true
consequence = "Not personal data: this is Claude's local Cowork sandbox VM disk image (often several GB). Deleting it while Claude Desktop is fully quit is a documented repair/cleanup step; Claude re-provisions the VM the next time Cowork is used, which can require downloading/rebuilding several gigabytes and means Cowork is unavailable until that finishes. Gated behind Deep Clean because of that cost, not because it is private."

[[rule]]
id = "claude.desktop.claude_code_vm"
tool = "claude"
root = "desktop"
label = "Cowork Claude runtime"
paths = ["claude-code-vm"]
risk = "review"
requires_stopped = true
consequence = "The downloadable Claude runtime used inside the Cowork VM. Re-downloaded automatically if missing; Cowork needs network access before it can run again."

[[rule]]
id = "claude.desktop.claude_code"
tool = "claude"
root = "desktop"
label = "Code-mode Claude runtime"
paths = ["claude-code"]
risk = "review"
requires_stopped = true
consequence = "The local Claude Code binary Desktop launches Code-mode sessions from. Re-downloaded automatically if missing."

[[rule]]
id = "claude.desktop.sessions"
tool = "claude"
root = "desktop"
label = "Code-mode session registry"
paths = ["claude-code-sessions"]
risk = "critical"
consequence = "Desktop's registry of Code-mode sessions (sidebar entries). The full transcripts live separately under ~/.claude/projects; deleting only the registry can orphan transcripts without a way to reopen them from Desktop. Never deleted."

[[rule]]
id = "claude.desktop.legacy_sessions"
tool = "claude"
root = "desktop"
label = "Legacy Code-mode session data"
paths = ["local-agent-mode-sessions"]
risk = "unknown"
consequence = "Older, since-migrated Code/Cowork session storage. Known migration bugs have left the only surviving copy of some session data here even after claude-code-sessions was created, and it can also hold an active skills-plugin checkout (skills-plugin/.../skills). Not in the published Claude storage map; needs cross-referencing before any entry can be called stale. Never deleted."

[[rule]]
id = "claude.desktop.identity"
tool = "claude"
root = "desktop"
label = "Device identity"
paths = ["ant-did", "ant-device-registry.json"]
risk = "critical"
consequence = "Claude Desktop's persistent device identity and trusted-device registration. Deleting can orphan sessions linked to this device and cannot be undone by reinstalling. Never deleted."

[[rule]]
id = "claude.desktop.config"
tool = "claude"
root = "desktop"
label = "Desktop configuration"
paths = ["claude_desktop_config.json", "config.json", "git-worktrees.json"]
risk = "critical"
consequence = "MCP server configuration, Code-mode workspace-trust state and Claude-created Git worktree registry. Never deleted."

[[rule]]
id = "claude.desktop.local_state"
tool = "claude"
root = "desktop"
label = "Desktop browser engine state"
paths = ["Local State"]
risk = "critical"
consequence = "Chromium installation-wide preferences and runtime metadata. Reset only as targeted troubleshooting; never auto-deleted."

[[rule]]
id = "claude.desktop.preferences"
tool = "claude"
root = "desktop"
label = "Reset embedded browser profile preferences"
paths = ["Preferences"]
risk = "review"
requires_stopped = true
consequence = "Resets the embedded Chromium profile's preferences. Not routine cleanup."

[[rule]]
id = "claude.desktop.bridge_state"
tool = "claude"
root = "desktop"
label = "Device-bridge and Cowork feature state"
paths = ["buddy-tokens.json", "cowork-enabled-cli-ops.json"]
risk = "review"
requires_stopped = true
consequence = "Device-bridge tokens and Cowork/CLI-ops enablement state. Recreated automatically, but deleting can force token re-issuance and temporarily reset Cowork integration."

[[rule]]
id = "claude.desktop.sentry"
tool = "claude"
root = "desktop"
label = "Diagnostic report state"
paths = ["sentry"]
risk = "unknown"
consequence = "May contain queued crash or diagnostic reports. Inspect its contents before any manual cleanup."

[[rule]]
id = "claude.desktop.usage_history"
tool = "claude"
root = "desktop"
label = "Local plan-usage history"
paths = ["plan-usage-history.json"]
risk = "safe"
requires_stopped = true
consequence = "Deletes locally cached historical plan-usage samples/charts. Account usage and limits are tracked server-side and are unaffected."

[[rule]]
id = "claude.desktop.regenerable"
tool = "claude"
root = "desktop"
label = "Regenerable desktop state"
paths = ["ca-bundle.pem", "window-state.json", "vm-support-probe.json", "extensions-blocklist.json"]
risk = "safe"
requires_stopped = true
consequence = "Generated CA bundle, window geometry, Cowork VM compatibility probe and extension blocklist cache. All recreated automatically."

[[rule]]
id = "vscode.cli.extensions"
tool = "vscode"
root = "cli"
label = "Installed extensions"
paths = ["extensions"]
risk = "critical"
consequence = "Installed VS Code extension payloads. Deleting leaves extensions marked installed but empty. Never deleted."

[[rule]]
id = "vscode.cli.config"
tool = "vscode"
root = "cli"
label = "CLI configuration"
paths = ["argv.json"]
risk = "critical"
consequence = "VS Code CLI startup flags. Never deleted."

[[rule]]
id = "vscode.app.cache"
tool = "vscode"
root = "app"
label = "Render and compile caches"
paths = ["Cache", "Code Cache", "CachedData", "GPUCache", "DawnWebGPUCache", "DawnGraphiteCache", "Service Worker", "Shared Dictionary", "Trust Tokens", "DIPS", "DIPS-wal", "DIPS-shm", "CachedProfilesData", "logs"]
risk = "safe"
requires_stopped = true
consequence = "Chromium render/compile caches. Regenerated automatically."

[[rule]]
id = "vscode.app.extension_installers"
tool = "vscode"
root = "app"
label = "Extension installer cache"
paths = ["CachedExtensionVSIXs"]
risk = "safe"
requires_stopped = true
consequence = "Downloaded .vsix installer packages for already-installed extensions. Re-downloaded if needed."

[[rule]]
id = "vscode.app.webdata"
tool = "vscode"
root = "app"
label = "Webview storage"
paths = ["Cookies", "Cookies-journal", "Local Storage", "Session Storage", "Partitions", "WebStorage"]
risk = "review"
requires_stopped = true
consequence = "Webview storage, including extension sign-in/session state. Some extensions may need to re-authenticate."

[[rule]]
id = "vscode.app.history"
tool = "vscode"
root = "app"
label = "Local file history"
paths = ["User/History"]
risk = "userdata"
requires_stopped = true
consequence = "Pre-edit local file snapshots used for the editor's local history/timeline. Deleting loses the ability to restore past versions."

[[rule]]
id = "vscode.app.workspace_storage"
tool = "vscode"
root = "app"
label = "Workspace storage"
paths = ["User/workspaceStorage"]
risk = "review"
requires_stopped = true
consequence = "Per-workspace extension state, including Copilot Chat sessions for that workspace. Commonly grows large from workspaces you no longer open; deleting loses that workspace's chat/extension state."

[[rule]]
id = "vscode.app.chat_sessions"
